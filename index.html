<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera Chatbot</title>
<style>
  :root {
    --bg: #f7f5f3;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --accent: #D97757;
    --bubble-user: #D97757;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #ececea;
    --bubble-assistant-text: #1a1a1a;
    --border: #e4e0db;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --surface: #242424;
      --text: #f0f0f0;
      --text-dim: #a0a0a0;
      --bubble-user: #D97757;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #333333;
      --bubble-assistant-text: #f0f0f0;
      --border: #3a3a3a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    font-weight: 600;
    font-size: 17px;
    text-align: center;
    z-index: 5;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-text);
    border-bottom-left-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 14px;
  }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #inputBox {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    resize: none;
    max-height: 100px;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled {
    opacity: 0.5;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
    padding: 0 30px;
  }
</style>
</head>
<body>
<header>💬 Mera Chatbot</header>
<div id="chat">
  <div class="empty-state" id="emptyState">Kuch bhi poochhiye, chatbot jawab dega.</div>
</div>
<div id="inputRow">
  <textarea id="inputBox" placeholder="Apna message likhein..." rows="1"></textarea>
  <button id="sendBtn">Bhejein</button>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

function addBubble(role, text) {
  if (emptyState && emptyState.parentNode) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function autoResize() {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
}
inputBox.addEventListener('input', autoResize);

function getBotReply(userMsg) {
  const text = userMsg.toLowerCase().trim();
  
  if (text.includes('hello') || text.includes('hi') || text.includes('hii') || text.includes('hey')) {
    return 'Namaste! Main aapka chatbot hoon. Main aapki kya madad kar sakta hoon?';
  } else if (text.includes('kaise ho') || text.includes('kaisa hai')) {
    return 'Main ekdam badhiya hoon! Aap batayein, aap kaise hain?';
  } else if (text.includes('naam')) {
    return 'Mera naam Mera Chatbot hai!';
  } else if (text.includes('kya kar sakte ho') || text.includes('help')) {
    return 'Main aapke baato ke jawab de sakta hoon! Aap mujhse hello, apna naam, ya kaise ho pooch sakte hain.';
  } else if (text.includes('bye') || text.includes('alvida')) {
    return 'Phir milenge! Aapka din shubh ho!';
  } else {
    return 'Aapka message mil gaya! Main abhi ek basic smart bot hoon, mujhse "hello" ya "kaise ho" pooch kar dekhein!';
  }
}

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;

  addBubble('user', text);
  inputBox.value = '';
  autoResize();
  sendBtn.disabled = true;

  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = 'Likh raha hai...';
  chatEl.appendChild(typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;

  setTimeout(() => {
    typingEl.remove();
    const replyText = getBotReply(text);
    addBubble('assistant', replyText);
    sendBtn.disabled = false;
  }, 600);
}

sendBtn.addEventListener('click', sendMessage);
inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
