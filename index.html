<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mera Chatbot</title>
<style>
  :root {
    --bg: #f7f5f3;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --accent: #D97757;
    --bubble-user: #D97757;
    --bubble-user-text: #ffffff;
    --bubble-assistant: #ececea;
    --bubble-assistant-text: #1a1a1a;
    --border: #e4e0db;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a1a;
      --surface: #242424;
      --text: #f0f0f0;
      --text-dim: #a0a0a0;
      --bubble-user: #D97757;
      --bubble-user-text: #ffffff;
      --bubble-assistant: #333333;
      --bubble-assistant-text: #f0f0f0;
      --border: #3a3a3a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    font-weight: 600;
    font-size: 17px;
    text-align: center;
    z-index: 5;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.4;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: var(--bubble-user-text);
    border-bottom-right-radius: 4px;
  }
  .assistant {
    align-self: flex-start;
    background: var(--bubble-assistant);
    color: var(--bubble-assistant-text);
    border-bottom-left-radius: 4px;
  }
  .typing {
    align-self: flex-start;
    color: var(--text-dim);
    font-size: 14px;
    padding: 4px 14px;
  }
  #inputRow {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #inputBox {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    resize: none;
    max-height: 100px;
    font-family: inherit;
  }
  #sendBtn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled {
    opacity: 0.5;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 15px;
    padding: 0 30px;
  }
</style>
</head>
<body>
<header>💬 Mera Chatbot</header>
<div id="chat">
  <div class="empty-state" id="emptyState">Kuch bhi poochhiye, AI jawab dega.</div>
</div>
<div id="inputRow">
  <textarea id="inputBox" placeholder="Apna message likhein..." rows="1"></textarea>
  <button id="sendBtn">Bhejein</button>
</div>

<script>
// Yahan apni Google AI Studio ki free API Key daalein
const GEMINI_API_KEY = "YOUR_GEMINI_API_KEY";

let history = [];
const chatEl = document.getElementById('chat');
const inputBox = document.getElementById('inputBox');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');

function addBubble(role, text) {
  if (emptyState && emptyState.parentNode) emptyState.remove();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function autoResize() {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 100) + 'px';
}
inputBox.addEventListener('input', autoResize);

async function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;

  if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY") {
    addBubble('assistant', 'Kripya code me apni Gemini API Key add karein.');
    return;
  }

  addBubble('user', text);
  history.push({ role: 'user', parts: [{ text: text }] });
  inputBox.value = '';
  autoResize();
  sendBtn.disabled = true;

  const typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.textContent = 'Likh raha hai...';
  chatEl.appendChild(typingEl);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history })
    });

    const data = await response.json();
    typingEl.remove();

    if (data.candidates && data.candidates[0].content.parts[0].text) {
      const replyText = data.candidates[0].content.parts[0].text;
      addBubble('assistant', replyText);
      history.push({ role: 'model', parts: [{ text: replyText }] });
    } else {
      addBubble('assistant', 'Jawab milne me samasya aayi.');
    }
  } catch (err) {
    typingEl.remove();
    addBubble('assistant', 'Error: ' + err.message);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
inputBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
